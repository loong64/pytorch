name: Build manywheel docker images

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
    tags:
      # NOTE: Binary build pipelines should only get triggered on release candidate or nightly builds
      # Release candidate tags look like: v1.11.0-rc1
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
    paths:
      - .ci/docker/**
      - .github/workflows/build-manywheel-images.yml
      - .github/actions/binary-docker-build/**
  pull_request:
    paths:
      - .ci/docker/**
      - .github/workflows/build-manywheel-images.yml
      - .github/actions/binary-docker-build/**

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: [
          { name: "manylinux_2_38_loongarch64", tag: "cpu-loongarch64", runner: "ubuntu-latest" },
        ]
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}:${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check version
        id: get_version
        run: |
          version=$(curl --retry 10 -s "https://api.github.com/repos/pytorch/pytorch/releases/latest" | jq -r .tag_name)
          if [ -z "${version}" ] || [ "${version}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi
          echo "latest_tag=${version}" >> $GITHUB_ENV

          cd .ci/docker/common
          rm -f install_openblas.sh
          wget -q https://github.com/pytorch/pytorch/raw/refs/tags/${version}/.ci/docker/common/install_openblas.sh
          sed -i 's/TARGET=\${OPENBLAS_TARGET:-}/TARGET=${OPENBLAS_TARGET:-GENERIC}/' install_openblas.sh
          chmod +x install_openblas.sh

          cat install_openblas.sh
        shell: bash

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .ci/docker
          file: .ci/docker/manywheel/Dockerfile_loongarch64
          platforms: linux/loong64
          push: true
          target: final
          # build-args: |
            # RUNNER_ARCH
          tags: |
            ghcr.io/loong64/manylinuxloongarch64-builder:${{ matrix.tag }}
            ghcr.io/loong64/manylinuxloongarch64-builder:${{ env.latest_tag }}
          cache-from: type=registry,ref=ghcr.io/loong64/manylinuxloongarch64-builder:buildcache
          cache-to: type=registry,ref=ghcr.io/loong64/manylinuxloongarch64-builder:buildcache,mode=max,compression=zstd,compression-level=22